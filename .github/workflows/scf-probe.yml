name: scf-probe
on:
  push:
    branches: [westchester-snapshots]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - run: cargo build --release -q -p receipts-snapshot
      - name: Fetch, build and verify 2025
        run: |
          B=target/release/receipts-snapshot
          $B fetch --source westchester --out raw --from 2025-01-01 --to 2026-01-01 2>&1 | tail -5
          $B build --source westchester --raw raw --out snap 2>&1 | tail -3
          $B verify snap/* | tail -1
          python3 - <<'PY'
          import json, glob
          s = json.load(open("raw/source.json"))
          print(f"::warning::kept {s['requests_kept']}, duplicates {s['duplicates']}, skipped {s['skipped_by_organization']}, {len(s['responses'])} responses")
          m = json.load(open(glob.glob("snap/*/manifest.json")[0]))
          print(f"::warning::{m['row_count']} rows; {m['scope']['sentence']}")
          print("::warning::rules " + json.dumps({r['id']: r['count'] for r in m['cleaning']['rules'] if r['count']}))
          print("::warning::issues " + json.dumps({k['id']: k['count'] for k in m['known_issues']}))
          for c in m["schema"]:
              print(f"::warning::{c['name']} nulls {c['null_count']} dict {c.get('dictionary_size')}")
          PY

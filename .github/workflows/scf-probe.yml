name: scf-probe
on:
  push:
    branches: [tmp-scf-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Count SeeClickFix reports in Westchester, by organization
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, collections
          UA = {"User-Agent": "receipts-engine (github.com/Edwin580/receipts-engine)"}
          BOX = "min_lat=40.88&max_lat=41.37&min_lng=-73.99&max_lng=-73.48"
          def get(q):
              url = "https://seeclickfix.com/api/v2/issues?" + q + "&per_page=100&status=open,acknowledged,closed,archived"
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      print("retry", attempt, e); time.sleep(20 * (attempt + 1))
              return None
          for y in (2024, 2025):
              d = get(f"{BOX}&after={y}-01-01T00:00:00-05:00&before={y+1}-01-01T00:00:00-05:00")
              if not d:
                  print(f"::warning::{y}: blocked"); continue
              total = d["metadata"]["pagination"]["entries"]
              print(f"::warning::Westchester box {y}: {total} reports")
              orgs, places, closed = collections.Counter(), collections.Counter(), 0
              pages = d["metadata"]["pagination"]["pages"]
              seen = 0
              for page in range(1, min(pages, 40) + 1):
                  if page > 1:
                      time.sleep(6)
                      d = get(f"{BOX}&after={y}-01-01T00:00:00-05:00&before={y+1}-01-01T00:00:00-05:00&page={page}")
                      if not d: break
                  for i in d["issues"]:
                      seen += 1
                      orgs[((i.get("request_type") or {}).get("organization")) or "none"] += 1
                      a = i.get("address") or ""
                      parts = [p.strip() for p in a.replace(" United States", "").replace(", USA", "").split(",")]
                      places[parts[-3] if len(parts) >= 3 else a[:30]] += 1
                      closed += bool(i.get("closed_at"))
              print(f"::warning::{y} read {seen}, closed {closed}; orgs {dict(orgs.most_common(15))}")
              print(f"::warning::{y} places {dict(places.most_common(15))}")
              time.sleep(10)
          PY
      - name: Sample of 2025 reports in the box
        run: |
          curl -sS -A "receipts-engine (github.com/Edwin580/receipts-engine)" "https://seeclickfix.com/api/v2/issues?min_lat=40.88&max_lat=41.37&min_lng=-73.99&max_lng=-73.48&after=2025-01-01T00:00:00-05:00&per_page=100&status=open,acknowledged,closed,archived" | python3 -c "
          import json,sys,collections
          d=json.load(sys.stdin); iss=d['issues']
          print('::warning::sample keys:', ','.join(sorted(iss[0].keys())) if iss else 'none')
          c=collections.Counter(((i.get('request_type') or {}).get('organization') or 'none') for i in iss)
          print('::warning::orgs:', dict(c.most_common(12)))
          t=collections.Counter(((i.get('request_type') or {}).get('title') or i.get('summary')) for i in iss)
          print('::warning::types:', dict(t.most_common(12)))
          closed=sum(1 for i in iss if i.get('closed_at'))
          print('::warning::closed', closed, 'of', len(iss), '| addresses:', [i.get('address') for i in iss[:5]])
          "

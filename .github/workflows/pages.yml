# Publishes the site (web/site) to GitHub Pages: builds the single
# threaded WASM package, runs the site tests, fetches a recent month of
# data from the city, and uploads web/site. Runs on every push to main and
# once a month, so the data stays current without being committed. If the
# fetch fails, or the site tests fail on the new month, it publishes the
# month committed in web/site/data instead.
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 3 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to publish, YYYY-MM (default: latest month that ended 30+ days ago)"
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WASM_BINDGEN: "0.2.128"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain with the wasm target
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -t wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked
      - run: tools/wasm/build.sh site
      - run: node --test web/site/test/*.test.mjs
      - name: Fetch a recent month from the city
        id: refresh
        continue-on-error: true
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          MONTH: ${{ inputs.month }}
        run: tools/site/refresh-data.sh "$RUNNER_TEMP/fresh"
      - name: Use it if the site tests pass on it
        if: steps.refresh.outcome == 'success'
        run: |
          cp -r web/site/data "$RUNNER_TEMP/committed"
          cp "$RUNNER_TEMP"/fresh/* web/site/data/
          if ! node --test web/site/test/*.test.mjs; then
            echo "::warning::The site tests fail on the new month; publishing the committed one."
            rm -rf web/site/data
            cp -r "$RUNNER_TEMP/committed" web/site/data
          fi
      - name: Restore the last Westchester data that was published
        uses: actions/cache/restore@v4
        with:
          path: web/site/westchester/data
          key: westchester-${{ github.run_id }}
          restore-keys: westchester-
      - name: Fetch the Westchester towns' requests
        id: westchester
        continue-on-error: true
        run: tools/site/refresh-westchester.sh "$RUNNER_TEMP/westchester"
      - name: Use them if the Westchester tests pass on them
        if: steps.westchester.outcome == 'success'
        run: |
          rm -rf "$RUNNER_TEMP/westchester-previous"
          if [ -d web/site/westchester/data ]; then cp -r web/site/westchester/data "$RUNNER_TEMP/westchester-previous"; fi
          mkdir -p web/site/westchester/data
          cp "$RUNNER_TEMP"/westchester/* web/site/westchester/data/
          if ! node --test web/site/test/westchester.test.mjs; then
            echo "::warning::The Westchester tests fail on the new data; publishing the previous data."
            rm -rf web/site/westchester/data
            if [ -d "$RUNNER_TEMP/westchester-previous" ]; then cp -r "$RUNNER_TEMP/westchester-previous" web/site/westchester/data; fi
          fi
      - name: Keep the Westchester data for the next run
        if: hashFiles('web/site/westchester/data/manifest.json') != ''
        uses: actions/cache/save@v4
        with:
          path: web/site/westchester/data
          key: westchester-${{ github.run_id }}
      - name: Say which data is published
        run: |
          node -e 'const m = require("./web/site/data/manifest.json"); console.log(`Published ${m.row_count} requests. ${m.scope.sentence} Snapshot ${m.snapshot_hash.slice(0, 16)}.`)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f web/site/westchester/data/manifest.json ]; then
            node -e 'const m = require("./web/site/westchester/data/manifest.json"); console.log(`Westchester: ${m.row_count} requests. ${m.scope.sentence} Snapshot ${m.snapshot_hash.slice(0, 16)}.`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No Westchester data to publish; the Westchester page will say so."
          fi
          if [ "${{ steps.westchester.outcome }}" != success ]; then
            echo "::warning::Couldn't fetch the Westchester towns' requests; publishing the previous data, if any."
          fi
          if [ "${{ steps.refresh.outcome }}" != success ]; then
            echo "::warning::Couldn't fetch a recent month; publishing the committed one."
          fi
      - name: Leave tests out of the published site
        run: rm -rf web/site/test
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: web/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5

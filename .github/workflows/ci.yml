name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt -c clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Snapshot differential oracle (synthetic, 50k records)
        run: |
          pip install pyarrow
          cargo build --release -p receipts-snapshot
          B=target/release/receipts-snapshot
          $B synth --out "$RUNNER_TEMP/raw" --rows 50000 --seed 7 --page-size 7000
          $B build --raw "$RUNNER_TEMP/raw" --out "$RUNNER_TEMP/snap"
          D=$(ls -d "$RUNNER_TEMP"/snap/*/)
          $B verify "$D"
          python3 tools/oracle/snapshot_oracle.py "$RUNNER_TEMP/raw" "$D"

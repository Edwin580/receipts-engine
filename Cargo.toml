[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Shared dependency versions live here once they are approved (see README
# "Dependencies"). Crates reference them with `dep.workspace = true`.
[workspace.dependencies]
receipts-core = { path = "crates/receipts-core" }
receipts-plan = { path = "crates/receipts-plan" }
receipts-exec = { path = "crates/receipts-exec" }
receipts-lineage = { path = "crates/receipts-lineage" }
receipts-cf = { path = "crates/receipts-cf" }
receipts-circuit = { path = "crates/receipts-circuit" }

anyhow = "1"
arrow-array = "60"
arrow-buffer = "60"
arrow-ipc = "60"
arrow-schema = "60"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
proptest = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
ureq = "3.4"

[workspace.lints.rust]
unsafe_code = "deny" # opt out per module, with a justification comment and a test
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only" # keep profiles readable
